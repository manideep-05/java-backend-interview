spring:
  application:
    name: locking-mastery-guide
  datasource:
    url: jdbc:h2:mem:lockingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Timeout in seconds for lock acquisition
        javax:
          persistence:
            lock:
              timeout: 3000

logging:
  level:
    com.concurrency.locking: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
